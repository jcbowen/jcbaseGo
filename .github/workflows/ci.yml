name: CI

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:
  schedule:
    # 每日 01:30 UTC（北京 09:30）复查依赖漏洞，漏洞数据库持续更新
    - cron: "30 1 * * *"

# 全部任务只读代码库；PR 摘要写入 $GITHUB_STEP_SUMMARY 无需额外权限
permissions:
  contents: read

# 同一分支的新提交取消仍在排队/运行的旧任务，master 保留历史运行记录
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  GOLANGCI_LINT_VERSION: v2.15.0
  # 工具版本统一在此固定（与 golangci-lint 一致），升级时改这里并跑一次 CI 验证
  GOVULNCHECK_VERSION: v1.9.0
  ACTIONLINT_VERSION: v1.7.12

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Download and verify modules
        run: |
          go mod download
          go mod verify

      - name: Check go.mod tidiness
        run: |
          cp go.mod /tmp/go.mod.orig
          cp go.sum /tmp/go.sum.orig
          go mod tidy
          if ! cmp -s go.mod /tmp/go.mod.orig || ! cmp -s go.sum /tmp/go.sum.orig; then
            echo "go.mod / go.sum 与 go mod tidy 结果不一致，请本地执行后一并提交："
            diff -u /tmp/go.mod.orig go.mod || true
            diff -u /tmp/go.sum.orig go.sum || true
            exit 1
          fi

      # .gitattributes 声明 eol=lf，此处兜底拦截 CRLF 与 UTF-8 BOM，
      # 否则 gofmt 会把整文件判为未格式化，产生大量伪脏 diff。
      # 用 git 原生的 --eol 判定索引与工作区行尾，避免 shell 里 CR 字面量被转义成 "r" 而误报。
      # 二进制文件（图片/字体等）在 --eol 输出里是 w/-text，无行尾概念，一并放行
      - name: Check line endings and BOM
        run: |
          bad_eol="$(git ls-files --eol | awk '$1 !~ /^i\/(lf|none)$/ || $2 !~ /^w\/(lf|none|-text)$/ {print $NF}')"
          if [ -n "$bad_eol" ]; then
            echo "以下文件的行尾不是 LF（索引 i/ 或工作区 w/ 检出 CRLF 或混合）："
            echo "$bad_eol"
            exit 1
          fi

          bad_bom=""
          while IFS= read -r f; do
            if [ "$(head -c 3 "$f" | od -An -tx1 | tr -d ' \n')" = "efbbbf" ]; then
              bad_bom="${bad_bom}${f}"$'\n'
            fi
          done < <(git ls-files -- '*.go' '*.yml' '*.yaml' '*.md')
          if [ -n "$bad_bom" ]; then
            echo "以下文件包含 UTF-8 BOM："
            echo "$bad_bom"
            exit 1
          fi

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "以下文件未按 gofmt 格式化："
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # 用 go install 而非第三方 Action，保证 Gitea Runner 同样可执行
      - name: golangci-lint
        run: |
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"
          # -v 固定版本，避免缓存中的旧版二进制遮蔽新装版本
          "$(go env GOPATH)/bin/golangci-lint" -v
          "$(go env GOPATH)/bin/golangci-lint" run

  test:
    name: Test (race)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test
        run: go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...

      # 只报告不设阈值：覆盖率作为评审参考，避免为凑数写无效断言
      - name: Coverage summary
        if: always()
        run: |
          if [ ! -f coverage.out ]; then
            echo "未生成 coverage.out，跳过摘要"
            exit 0
          fi
          all="$(go tool cover -func coverage.out | awk '/^total:/ {print $NF}')"
          {
            echo "### 测试覆盖率"
            echo
            echo "- 全仓语句覆盖率：**${all}**（example 为演示代码，无测试会拉低该值）"
            echo
            echo "| 包 | 语句覆盖率 | 占比 |"
            echo "| --- | --- | --- |"
            awk '
              NR > 1 {
                split($1, loc, ":")
                path = loc[1]
                sub(/^github\.com\/jcbowen\/jcbaseGo\/?/, "", path)
                sub(/\/[^\/]*\.go$/, "", path)
                if (path !~ /\//) path = "."
                stmt_all += $2
                if ($3 > 0) hit_all += $2
                if (path ~ /^example/) next
                stmt[path] += $2
                hit[path] += ($3 > 0 ? $2 : 0)
                ex_stmt += $2
                ex_hit += ($3 > 0 ? $2 : 0)
              }
              END {
                printf "| **合计（不含 example）** | **%.1f%%** | %d/%d 语句 |\n", \
                  ex_stmt ? 100 * ex_hit / ex_stmt : 0, ex_hit, ex_stmt
                for (p in stmt) {
                  printf "| `%s` | %.1f%% | %d/%d |\n", p, \
                    stmt[p] ? 100 * hit[p] / stmt[p] : 0, hit[p], stmt[p]
                }
                printf "| （全仓含 example） | %.1f%% | %d/%d |\n", \
                  stmt_all ? 100 * hit_all / stmt_all : 0, hit_all, stmt_all
              }
            ' coverage.out | sort -t'|' -k2
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Generate HTML report
        if: always()
        run: go tool cover -html=coverage.out -o coverage.html

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.out
            coverage.html
          retention-days: 14

  # race 检测器只在 Linux 上稳定；其余平台做普通运行，
  # 用于捕捉文件锁、路径分隔符、大小写敏感等仅在 Windows/macOS 暴露的问题
  test-cross-os:
    name: Test (${{ matrix.os }})
    if: github.server_url == 'https://github.com'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test
        shell: bash
        # SQLite 已切换为纯 Go 驱动（glebarez/sqlite），不再依赖 CGO，
        # Windows/macOS 上完整运行，覆盖文件锁、路径分隔符等平台差异
        run: go test -count=1 ./...

  # 单 runner 交叉编译，无需 Windows/macOS Runner，Gitea 也能完整执行
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build
        run: go build ./...

  # 只报告代码实际调用到的漏洞，比按版本号 grep 依赖树准确
  vuln:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 自建 Runner 可能访问不到 vuln.go.dev，非 GitHub 环境降级为不阻塞
    continue-on-error: ${{ github.server_url != 'https://github.com' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: govulncheck
        run: |
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          "$(go env GOPATH)/bin/govulncheck" ./...

  meta:
    name: Workflow Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: actionlint
        run: |
          go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"
          "$(go env GOPATH)/bin/actionlint" -color
